name: Refresh DOKDO FC and publish
on:
  workflow_dispatch:
  # A collector/config change starts a refresh immediately, in addition to the scheduled runs.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-and-publish.yml'
      - 'collect.py'
      - 'requirements.txt'
      - 'tests/**'
  schedule:
    # Every 5 minutes (UTC minute 03, 08, 13, ..., 58); avoid top-of-hour load.
    - cron: '3-58/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dokdo-fc-pages
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install unofficial EA reader
        run: pip install -r requirements.txt
      # Presentation regression tests still reference the retired, inline-script homepage.
      # Never let obsolete UI assertions prevent archiving new EA matches.
      - name: Verify collector archive integrity before data collection
        run: |
          python -m unittest discover -s tests -p 'test_collector.py' -v
          python -m unittest discover -s tests -p 'test_dashboard_ui.py' -v
          python -m unittest discover -s tests -p 'test_push.py' -v
      - name: Collect live FC27 records
        run: python collect.py
      - name: Check both permanent archives
        run: |
          python -m json.tool data/dashboard.json > /dev/null
          python -m json.tool data/history.json > /dev/null
      - name: Send opt-in web push for newly archived league matches
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python tools/push_matches.py
      - name: Monitor long-term archive storage without deleting any records
        run: python tools/check_storage.py
      - name: Persist match and all changing player stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/history.json data/push-state.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update DOKDO FC stats [skip ci]"
            # A concurrent site edit can advance main after checkout. Never force-push
            # or silently replace a newer archive: rebase, fail closed on conflicts.
            pushed=false
            for attempt in 1 2 3 4; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "A newer archive conflicts with this run; refusing to overwrite it."
                exit 1
              fi
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Remote advanced during push, retrying safe rebase ($attempt/4)"
              sleep 3
            done
            if [ "$pushed" != true ]; then
              echo "Could not publish the updated archive after 4 safe retries."
              exit 1
            fi
          fi
      - name: Render KakaoTalk preview card (1200 x 630)
        run: |
          python -m pip install "CairoSVG>=2.7,<3"
          python tools/render_social.py
          test -s assets/og-dokdo-fc.png
      - uses: actions/configure-pages@v5
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
