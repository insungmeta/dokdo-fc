name: Refresh DOKDO FC and publish
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches:
      - main
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dokdo-fc-pages
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install unofficial EA reader
        run: pip install -r requirements.txt
      - name: Collect live FC27 records
        run: python collect.py
      - name: Check archived JSON
        run: python -m json.tool data/dashboard.json > /dev/null
      - name: Persist match history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m "Update DOKDO FC stats [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
