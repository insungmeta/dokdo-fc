name: Publish DOKDO FC website (fast)
on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'legal.html'
      - 'legacy.html'
      - 'live-dashboard-v7.js'
      - 'mobile-app-v8.css'
      - 'mobile-app-v8.js'
      - 'i18n-*.js'
      - 'tactical-lab-v1.js'
      - 'tactical-lab-v1.css'
      - 'assets/**'
      - 'push/**'
      - 'site.webmanifest'
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dokdo-fc-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website files
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Upload website (no EA API dependency)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub sometimes needs a short propagation window before deploy-pages
      # can discover a successfully uploaded github-pages artifact.
      - name: Allow Pages artifact metadata to become available
        run: sleep 20
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
